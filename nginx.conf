server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip common static types
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets (JS/CSS) and menu images: cache aggressively.
    # Vite emits fingerprinted bundles under /assets/, and public/
    # images are copied to /assets/images/.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: the app is a single React page (BrowserRouter).
    # /pos, /pos/orders, /pos/reports, /pos/settings, /receipt/:id
    # all serve index.html and let React Router handle the route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}